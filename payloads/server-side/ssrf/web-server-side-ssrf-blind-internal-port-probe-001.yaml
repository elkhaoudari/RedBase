expected_behavior: Substitute the address and port under test. Response times differ between a port that accepts a connection and one that refuses immediately. Repeated measurements per port are required; single samples produce false positives from network noise. This is a semi-blind variant — the application does not return the destination's response, but timing leaks whether the connection was accepted.
